name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing+=("CLOUDFLARE_API_TOKEN"); fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then missing+=("CLOUDFLARE_ACCOUNT_ID"); fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing Cloudflare repository secrets::Missing: ${missing[*]}. Add them in Settings -> Secrets and variables -> Actions. CLOUDFLARE_API_TOKEN needs the 'Edit Cloudflare Workers' API token template, and CLOUDFLARE_ACCOUNT_ID is the account id printed by 'wrangler whoami'."
            echo "### Deployment blocked: missing Cloudflare secrets" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "Set them in Settings -> Secrets and variables -> Actions, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Cloudflare credentials are present."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
